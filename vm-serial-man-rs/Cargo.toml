[package]
name = "vm-serial-man"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-serial = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "fmt", "registry"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
bytes = "1.9"
chrono = "0.4"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
