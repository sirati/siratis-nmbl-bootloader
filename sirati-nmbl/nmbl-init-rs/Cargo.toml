[package]
name = "nmbl-init"
version = "0.1.0"
edition = "2024"
description = "Rust /init for the NixOS Minimal BootLoader (NMBL)."
license = "MIT"
publish = false

[lib]
name = "nmbl_init"
path = "src/lib.rs"

[[bin]]
name = "nmbl-init"
path = "src/main.rs"

# Size-tuned release profile. -Oz + fat LTO + 1 codegen unit + strip is the
# canonical recipe; unwind stays on so the panic hook can re-exec into the
# recovery path instead of letting PID 1 die.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
overflow-checks = true   # we'd rather abort than wrap silently
incremental = false

# We refuse to ship a binary that contains any of the panic-producing
# constructs. These lints are enforced project-wide so reviewers don't have
# to argue about them.
[lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
indexing_slicing = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
dbg_macro        = "deny"
print_stderr     = "allow"   # we _do_ print to stderr — that's our log channel
print_stdout     = "allow"

[features]
default = ["pretty-shell"]
# In-process `alacritty_terminal`-backed PTY terminal hosted inside the
# bordered TUI (the "Pretty Shell"). Backend-agnostic, so it renders fine
# on the tty/serial Console as well as the splash framebuffer. Default-on
# so the normal build offers it; `--no-default-features` drops back to the
# bare `[Raw Shell]` busybox relay and the minimal closure.
pretty-shell = ["dep:alacritty_terminal"]
# Phase D rescue-fallback network primitives. When OFF the `src/net/`
# tree is `#[cfg]`d out and the optional deps are not compiled, so
# enabling this feature is purely additive — the default build is
# byte-for-byte identical to a feature-free build. The
# `nix/net` activator pulls in `nix::sys::socket` only when the
# rescue path is compiled in, so DHCP's `sockaddr_ll` is in scope.
network-rescue = ["dep:dhcproto", "dep:sha2", "dep:getrandom", "nix/net"]
# Opt-in persistent boot state (state.bin under /nmbl-state). When OFF
# the `src/state.rs` module is `#[cfg]`d out and the optional deps
# (`ciborium`, `nonmax`) are not compiled, so the default build is
# byte-for-byte identical to a feature-free build. Forward-compat is
# carried by ciborium's self-describing wire format and the State
# struct's permissive serde defaults (see `src/state.rs`).
stateful = ["dep:ciborium", "dep:nonmax"]
# Opt-in graphical boot splash. Adds DRM mode-set on simpledrm, a PNG
# background, and a fontdue-rasterized overlay of the ratatui menu.
# Any failure of the splash path falls back to today's tty UI.
image-splash = ["dep:drm", "dep:png", "dep:fontdue", "pretty-shell", "rustix/event", "dep:oklab"]
# Opt-in TUI mocking harness. Adds a `--debug-tui -- <scenario> [args…]`
# entrypoint that runs a single modal flow on the current terminal
# (stdin/stdout via crossterm) instead of executing the PID-1 boot
# pipeline. Used by test runners that spawn the binary inside a tmux
# pane to exercise modal sizing/scrolling without a VM. Compiled out
# of release builds — production initramfs MUST NOT carry this code.
mocking = []

[dependencies]
nix = { version = "0.29", default-features = false, features = ["mount", "fs", "process", "term", "user", "signal", "reboot", "feature"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "1"
ratatui = { version = "0.30", default-features = false, features = ["termwiz", "crossterm", "std"] }
# termwiz drives all terminal IO. Its `InputParser` is a pure
# byte-stream parser that doesn't open any fds (unlike crossterm,
# which lazily opens stdin or `/dev/tty` inside a `OnceLock` of
# global state). NMBL owns the `/dev/console` fd directly and feeds
# bytes to termwiz; ratatui's in-tree `TermwizBackend` writes through
# the same termwiz `BufferedTerminal`, so crossterm's input
# `OnceLock` is never touched.
#
# `crossterm` itself stays as a leaf data-type dep: KeyEvent /
# KeyCode / KeyModifiers / KeyEventKind are the well-known shapes
# the App state machine and modal handlers match against. We
# translate termwiz's InputEvent into these at the boundary in
# `ui::console::parser` and never call any of crossterm's runtime
# entry points (no `event::poll`, no `event::read`, no
# `enable_raw_mode`).
crossterm = "0.28"
termwiz = { version = "0.23", default-features = false }
# Direct dep so we can parse a bundled compiled terminfo entry via
# `terminfo::Database::from_buffer`. The initramfs ships no terminfo
# database, so without this termwiz has no `cup` (CursorAddress)
# capability and its renderer falls back to a CSI cursor-address path
# that transposes row/col — corrupting every incremental repaint. This
# is the same `terminfo` crate termwiz already depends on (re-exported
# only on Windows), pinned to the version in the lockfile.
terminfo = { version = "0.9", default-features = false }
zeroize = { version = "1", features = ["derive"] }
# rustix is already pulled in transitively via crossterm; promote it to an
# explicit dependency so its safe wrappers for open(2) / termios are visible
# at the manifest level.
rustix = { version = "0.38", default-features = false, features = ["fs", "termios", "std", "event"] }
# Pure-Rust decompression for kernel modules. NixOS kernels are built
# without CONFIG_MODULE_DECOMPRESS, so userspace must decompress
# .ko.{xz,zst,gz} before calling init_module(2). C-FFI crates (xz2,
# zstd, flate2's default backend) would break the static-musl build,
# so each of these is locked to its pure-Rust implementation.
lzma-rs = { version = "0.3", default-features = false }
ruzstd = { version = "0.7", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Optional dependencies behind the `image-splash` feature. With the
# feature off these are not compiled and the binary is byte-identical
# to the pre-feature build. Default-features off everywhere so the
# closure stays minimal; `alacritty_terminal` in particular pulls
# `serde` by default which we don't want.
drm = { version = "0.15", optional = true }
png = { version = "0.17", optional = true, default-features = false }
fontdue = { version = "0.9", optional = true, default-features = false }
alacritty_terminal = { version = "0.26", optional = true, default-features = false }
oklab = { version = "1.1.2", optional = true, default-features = true }
# Phase D rescue-fallback (optional; gated behind `network-rescue`).
# dhcproto provides the DHCPv4 wire codec used by `src/net/dhcp.rs`
# (D.2). sha2 provides SHA-256 used by `src/net/http.rs` (D.3) to
# verify the rescue blob against the operator-pinned digest.
dhcproto = { version = "0.13", optional = true, default-features = false }
sha2     = { version = "0.10", optional = true, default-features = false }
# Single 4-byte read for the DHCPv4 XID. We avoid pulling in a full RNG
# crate (`rand`); `getrandom::fill` reads straight from `getrandom(2)`.
getrandom = { version = "0.3", optional = true, default-features = false }
# Phase 3 persistent state (optional; gated behind `stateful`). ciborium
# is the self-describing CBOR codec used for state.bin so older binaries
# can read newer files by skipping unknown fields. nonmax compresses
# `Option<NonMaxU32>` to four bytes (niche optimisation) for the
# generation-id slots; its `serde` feature plumbs the encoding through.
ciborium = { version = "0.2", default-features = false, features = ["std"], optional = true }
nonmax   = { version = "0.5", default-features = false, features = ["serde"], optional = true }

[dev-dependencies]
tempfile = "3"
