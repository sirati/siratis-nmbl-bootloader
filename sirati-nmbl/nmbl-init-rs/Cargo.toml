[package]
name = "nmbl-init"
version = "0.1.0"
edition = "2024"
description = "Rust /init for the NixOS Minimal BootLoader (NMBL)."
license = "MIT"
publish = false

[lib]
name = "nmbl_init"
path = "src/lib.rs"

[[bin]]
name = "nmbl-init"
path = "src/main.rs"

# Size-tuned release profile. -Oz + fat LTO + 1 codegen unit + strip is the
# canonical recipe; unwind stays on so the panic hook can re-exec into the
# recovery path instead of letting PID 1 die.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
overflow-checks = true   # we'd rather abort than wrap silently
incremental = false

# We refuse to ship a binary that contains any of the panic-producing
# constructs. These lints are enforced project-wide so reviewers don't have
# to argue about them.
[lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
indexing_slicing = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
dbg_macro        = "deny"
print_stderr     = "allow"   # we _do_ print to stderr — that's our log channel
print_stdout     = "allow"

[dependencies]
nix = { version = "0.29", default-features = false, features = ["mount", "fs", "process", "term", "user", "signal", "reboot", "feature"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "1"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
zeroize = { version = "1", features = ["derive"] }
# rustix is already pulled in transitively via crossterm; promote it to an
# explicit dependency so its safe wrappers for open(2) / termios are visible
# at the manifest level.
rustix = { version = "0.38", default-features = false, features = ["fs", "termios", "std"] }
# Pure-Rust decompression for kernel modules. NixOS kernels are built
# without CONFIG_MODULE_DECOMPRESS, so userspace must decompress
# .ko.{xz,zst,gz} before calling init_module(2). C-FFI crates (xz2,
# zstd, flate2's default backend) would break the static-musl build,
# so each of these is locked to its pure-Rust implementation.
lzma-rs = { version = "0.3", default-features = false }
ruzstd = { version = "0.7", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Optional dependencies behind the `image-splash` feature. With the
# feature off these are not compiled and the binary is byte-identical
# to the pre-feature build. Default-features off everywhere so the
# closure stays minimal; `alacritty_terminal` in particular pulls
# `serde` by default which we don't want.
drm = { version = "0.15", optional = true }
png = { version = "0.17", optional = true, default-features = false }
fontdue = { version = "0.9", optional = true, default-features = false }
alacritty_terminal = { version = "0.26", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Opt-in graphical boot splash. Adds DRM mode-set on simpledrm, a PNG
# background, and a fontdue-rasterized overlay of the ratatui menu.
# Any failure of the splash path falls back to today's tty UI.
image-splash = ["dep:drm", "dep:png", "dep:fontdue", "dep:alacritty_terminal", "rustix/event"]
