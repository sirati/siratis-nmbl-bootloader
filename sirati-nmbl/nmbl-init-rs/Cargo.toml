[package]
name = "nmbl-init"
version = "0.1.0"
edition = "2024"
description = "Rust /init for the NixOS Minimal BootLoader (NMBL)."
license = "MIT"
publish = false

[lib]
name = "nmbl_init"
path = "src/lib.rs"

[[bin]]
name = "nmbl-init"
path = "src/main.rs"

# Size-tuned release profile. -Oz + fat LTO + 1 codegen unit + strip is the
# canonical recipe; unwind stays on so the panic hook can re-exec into the
# recovery path instead of letting PID 1 die.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
overflow-checks = true   # we'd rather abort than wrap silently
incremental = false

# We refuse to ship a binary that contains any of the panic-producing
# constructs. These lints are enforced project-wide so reviewers don't have
# to argue about them.
[lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
indexing_slicing = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
dbg_macro        = "deny"
print_stderr     = "allow"   # we _do_ print to stderr — that's our log channel
print_stdout     = "allow"

[dependencies]
nix = { version = "0.29", default-features = false, features = ["mount", "fs", "process", "term", "user", "signal", "reboot", "feature"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "1"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
zeroize = { version = "1", features = ["derive"] }
# rustix is already pulled in transitively via crossterm; promote it to an
# explicit dependency so its safe wrappers for open(2) / termios are visible
# at the manifest level.
rustix = { version = "0.38", default-features = false, features = ["fs", "termios", "std"] }

[dev-dependencies]
tempfile = "3"
