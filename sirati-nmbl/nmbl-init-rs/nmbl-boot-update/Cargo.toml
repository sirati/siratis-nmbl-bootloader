[package]
name = "nmbl-boot-update"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "nmbl-boot-update"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
cap-std = "3"
nmbl-host-tools = { path = "../nmbl-host-tools" }
rustix = { version = "0.38", default-features = false, features = ["fs", "net", "process", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
